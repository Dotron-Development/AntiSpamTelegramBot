name: deploy review SPA

on:
  workflow_call:
    inputs:
      environment:
        required: true
        type: string
      resource_group_name:
        required: true
        type: string
      static_web_app_name:
        required: true
        type: string
      api_url:
        required: true
        type: string

permissions:
  id-token: write
  contents: read

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment }}
    env:
      RESOURCE_GROUP_NAME: ${{ inputs.resource_group_name }}
      STATIC_WEB_APP_NAME: ${{ inputs.static_web_app_name }}
      API_URL: ${{ inputs.api_url }}

    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: src/web/package-lock.json

      - name: Azure login
        uses: azure/login@v3.1.0
        with:
          client-id: ${{ secrets.ARM_CLIENT_ID }}
          tenant-id: ${{ secrets.ARM_TENANT_ID }}
          subscription-id: ${{ secrets.ARM_SUBSCRIPTION_ID }}

      - name: Validate public API URL
        run: |
          node --input-type=module <<'NODE'
          const value = process.env.API_URL;
          const url = new URL(value);
          if (url.protocol !== 'https:' || value !== url.origin) {
            throw new Error('API_URL must be an HTTPS origin');
          }
          NODE

      - name: Install dependencies
        working-directory: src/web
        run: npm ci

      - name: Lint
        working-directory: src/web
        run: npm run lint

      - name: Build React SPA
        working-directory: src/web
        run: npm run build

      - name: Publish SPA artifact
        uses: actions/upload-artifact@v7.0.2
        with:
          name: review-spa-${{ inputs.environment }}
          path: src/web/dist
          if-no-files-found: error

      - name: Read Static Web Apps deployment token
        id: deployment-token
        shell: bash
        run: |
          set -euo pipefail
          token=$(az staticwebapp secrets list \
            --resource-group "$RESOURCE_GROUP_NAME" \
            --name "$STATIC_WEB_APP_NAME" \
            --query properties.apiKey --output tsv)
          if [[ -z "$token" || "$token" == "null" || "$token" == *$'\n'* || "$token" == *$'\r'* ]]; then
            echo "Error: Static Web Apps deployment token is missing or invalid."
            exit 1
          fi
          echo "::add-mask::$token"
          echo "token=$token" >> "$GITHUB_OUTPUT"

      - name: Deploy SPA to Azure Static Web Apps
        uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ steps.deployment-token.outputs.token }}
          action: upload
          app_location: src/web/dist
          api_location: ""
          output_location: ""
          skip_app_build: true
          skip_api_build: true
          production_branch: ${{ github.ref_name }}