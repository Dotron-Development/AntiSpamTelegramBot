name: PR checks

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pr-checks-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  dotnet:
    name: .NET build and tests
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false

      - name: Setup .NET
        uses: actions/setup-dotnet@v6.0.0
        with:
          dotnet-version: '11.0.x'

      - name: Restore
        run: |
          dotnet restore AntiSpamTelegramBot.sln
          dotnet restore src/bot/TelegramAntiSpamBot.Functions/TelegramAntiSpamBot.Functions.csproj

      - name: Build
        run: dotnet build AntiSpamTelegramBot.sln --configuration Release --no-restore

      - name: Run offline tests
        working-directory: tests/TelegramAntiSpamBot.IntegrationTests
        run: dotnet test --configuration Release --no-build --filter "Category!=External" --logger "trx;LogFileName=tests.trx" --results-directory "${{ github.workspace }}/TestResults"

      - name: Upload test results
        if: ${{ always() }}
        uses: actions/upload-artifact@v7.0.2
        with:
          name: dotnet-test-results
          path: TestResults/*.trx
          if-no-files-found: ignore
