name: release prod

on:
  workflow_dispatch:
    inputs:
      environment:
        description: "Environment to deploy"
        required: true
        default: "ppr"
        type: choice
        options:
          - ppr
          - prod

concurrency:
  group: infrastructure-${{ github.event.inputs.environment }}
  cancel-in-progress: false

permissions:
  id-token: write
  contents: read

jobs:
  deploy-main-infrastructure:
    uses: ./.github/workflows/main-infrastructure.yaml
    with:
      environment: ${{ github.event.inputs.environment }}
    secrets: inherit

  deploy-functionapp:
    needs: deploy-main-infrastructure
    uses: ./.github/workflows/functionapp.yaml
    with:
      environment: ${{ github.event.inputs.environment }}
      resource_group_name: ${{ needs.deploy-main-infrastructure.outputs.resource_group_name }}
      function_app_name: ${{ needs.deploy-main-infrastructure.outputs.functionapp_name }}
      function_app_identity_name: ${{ needs.deploy-main-infrastructure.outputs.function_app_identity_name }}
    secrets: inherit

  deploy-review-spa:
    needs: [deploy-main-infrastructure, deploy-functionapp]
    uses: ./.github/workflows/webapp.yaml
    with:
      environment: ${{ github.event.inputs.environment }}
      resource_group_name: ${{ needs.deploy-main-infrastructure.outputs.resource_group_name }}
      web_app_name: ${{ needs.deploy-main-infrastructure.outputs.review_web_app_name }}
    secrets: inherit

  cleanup-runner-endpoints:
    needs: [deploy-functionapp, deploy-review-spa]
    uses: ./.github/workflows/cleanup-runner-endpoints.yaml
    with:
      environment: ${{ github.event.inputs.environment }}
    secrets: inherit
