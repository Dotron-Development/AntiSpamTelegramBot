name: destroy-ci
on:
  workflow_dispatch:
    inputs:
      environment:
        description: "Environment to destroy"
        required: true
        default: "dev"
        type: choice
        options:
          - dev
          - prod
          - ppr

concurrency:
  group: infrastructure-${{ github.event.inputs.environment }}
  cancel-in-progress: false

permissions:
  id-token: write
  contents: read

jobs:
  destroy-infrastructure:
    uses: ./.github/workflows/destroy-infrastructure.yaml
    with:
      environment: ${{ github.event.inputs.environment }}
    secrets: inherit
