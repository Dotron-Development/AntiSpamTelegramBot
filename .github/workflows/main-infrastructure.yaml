name: main-infrastructure

on:
  workflow_call:
    inputs:
      environment:
        required: true
        type: string

    outputs:
      resource_group_name:
        description: "The name of the resource group"
        value: ${{ jobs.main-infrastructure.outputs.resource_group_name }}
      functionapp_name:
        description: "The name of the function app"
        value: ${{ jobs.main-infrastructure.outputs.functionapp_name }}
      function_app_identity_name:
        description: "The function app identity name for the Key Vault reference"
        value: ${{ jobs.main-infrastructure.outputs.function_app_identity_name }}
      review_web_app_name:
        description: "The review SPA Web App name"
        value: ${{ jobs.main-infrastructure.outputs.review_web_app_name }}
      review_web_app_url:
        description: "The review SPA URL and Entra SPA redirect URI"
        value: ${{ jobs.main-infrastructure.outputs.review_web_app_url }}

env:
  # service principal credentials
  ARM_TENANT_ID: ${{ secrets.ARM_TENANT_ID }}
  ARM_SUBSCRIPTION_ID: ${{ secrets.ARM_SUBSCRIPTION_ID }}
  ARM_CLIENT_ID: ${{ secrets.ARM_CLIENT_ID }}
  ARM_CLIENT_SECRET: ${{ secrets.ARM_CLIENT_SECRET }}

jobs:
  setup-vm-runner-connectivity:
    uses: ./.github/workflows/runner-connectivity.yaml
    with:
      environment: ${{ inputs.environment }}
      enable_runner_endpoints: true
    secrets: inherit

  main-infrastructure:
    needs: setup-vm-runner-connectivity
    runs-on: self-hosted
    environment: ${{ inputs.environment }}
    env:
      TF_VAR_review_user_object_ids: ${{ vars.REVIEW_USER_OBJECT_IDS || '[]' }}
      TF_VAR_review_frontend_origins: ${{ vars.REVIEW_FRONTEND_ORIGINS || '["http://localhost:5173"]' }}

    outputs:
      resource_group_name: ${{ steps.generate-outputs.outputs.resource_group_name }}
      functionapp_name: ${{ steps.generate-outputs.outputs.functionapp_name }}
      function_app_identity_name: ${{ steps.generate-outputs.outputs.function_app_identity_name }}
      review_web_app_name: ${{ steps.generate-outputs.outputs.review_web_app_name }}
      review_web_app_url: ${{ steps.generate-outputs.outputs.review_web_app_url }}

    defaults:
      run:
        working-directory: src/infrastructure

    steps:
      - name: Checkout code
        uses: actions/checkout@v7.0.1

      - name: Verify Inputs
        run: |
          allowed_environments=("dev" "prod" "ppr")
          if [[ ! " ${allowed_environments[@]} " =~ " ${{ inputs.environment }} " ]]; then
            echo "Invalid environment: ${{ inputs.environment }}. Allowed values are: ${allowed_environments[@]}"
            exit 1
          fi

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v4.0.1
        with:
          terraform_version: "1.17.0"
          terraform_wrapper: false

      - name: Terraform Init
        env:
          # backend configuration
          AZ_TERRAFORM_BACKEND_STORAGEACCOUNT: ${{ vars.AZ_TERRAFORM_BACKEND_STORAGEACCOUNT }}
          AZ_TERRAFORM_BACKEND_RESOURCEGROUP: ${{ vars.AZ_TERRAFORM_BACKEND_RESOURCEGROUP }}
          AZ_BACKEND_CONTAINER_NAME: ${{ inputs.environment }}
          AZ_MAIN_STATE_FILE_KEY: "terraform.tfstate"
        run: |
          terraform init \
            -backend-config="storage_account_name=${AZ_TERRAFORM_BACKEND_STORAGEACCOUNT}"  \
            -backend-config="container_name=${AZ_BACKEND_CONTAINER_NAME}" \
            -backend-config="key=${AZ_MAIN_STATE_FILE_KEY}" \
            -backend-config="resource_group_name=${AZ_TERRAFORM_BACKEND_RESOURCEGROUP}" \

      - name: Terraform Plan
        env:
          AZ_OWNER_OBJECT_ID: ${{ secrets.AZ_OWNER_OBJECT_ID }}
          AZ_BACKEND_CONTAINER_NAME: ${{ inputs.environment }}
          AZ_TERRAFORM_BACKEND_STORAGEACCOUNT: ${{ vars.AZ_TERRAFORM_BACKEND_STORAGEACCOUNT }}
          AZ_TERRAFORM_BACKEND_RESOURCEGROUP: ${{ vars.AZ_TERRAFORM_BACKEND_RESOURCEGROUP }}
        run: |
          terraform plan -out=tfplan -var-file=environments/${{ inputs.environment }}.tfvars \
            -var="keyvault_administrator_object_id=${AZ_OWNER_OBJECT_ID}" \
            -var="telegram_bot_token=${{ secrets.TELEGRAM_BOT_TOKEN }}" \
            -var="telegram_bot_secret_header=${{ secrets.TELEGRAM_BOT_SECRET_HEADER }}"

      - name: Apply Terraform plan
        run: terraform apply tfplan

      - name: Generate outputs
        id: generate-outputs
        run: |
          RESOURCE_GROUP_NAME=$(terraform output -raw resource_group_name)
          FUNCTION_APP_NAME=$(terraform output -raw functionapp_name)
          FUNCTION_APP_IDENTITY_NAME=$(terraform output -raw function_app_identity_name)
          REVIEW_WEB_APP_NAME=$(terraform output -raw review_web_app_name)
          REVIEW_WEB_APP_URL=$(terraform output -raw review_web_app_url)
          if [ -z "$RESOURCE_GROUP_NAME" ] || [ -z "$FUNCTION_APP_NAME" ] || [ -z "$FUNCTION_APP_IDENTITY_NAME" ]; then
            echo "Error: RESOURCE_GROUP_NAME or FUNCTION_APP_NAME or FUNCTION_APP_IDENTITY_NAME is empty."
            exit 1
          fi
          echo "resource_group_name=$RESOURCE_GROUP_NAME" >> $GITHUB_OUTPUT
          echo "functionapp_name=$FUNCTION_APP_NAME" >> $GITHUB_OUTPUT
          echo "function_app_identity_name=$FUNCTION_APP_IDENTITY_NAME" >> $GITHUB_OUTPUT
          if [ -z "$REVIEW_WEB_APP_NAME" ] || [ -z "$REVIEW_WEB_APP_URL" ]; then
            echo "Error: Review Web App outputs are empty."
            exit 1
          fi
          echo "review_web_app_name=$REVIEW_WEB_APP_NAME" >> $GITHUB_OUTPUT
          echo "review_web_app_url=$REVIEW_WEB_APP_URL" >> $GITHUB_OUTPUT

  configure-key-vault-references:
    needs: main-infrastructure
    runs-on: self-hosted
    environment: ${{ inputs.environment }}

    steps:
      - name: Azure login
        uses: azure/login@v3.1.0
        with:
          creds: '{"clientId":"${{ secrets.ARM_CLIENT_ID }}","clientSecret":"${{ secrets.ARM_CLIENT_SECRET }}","subscriptionId":"${{ secrets.ARM_SUBSCRIPTION_ID }}","tenantId":"${{ secrets.ARM_TENANT_ID }}"}'

      - name: Configure Key Vault reference identity
        shell: bash
        env:
          RESOURCE_GROUP_NAME: ${{ needs.main-infrastructure.outputs.resource_group_name }}
          FUNCTION_APP_NAME: ${{ needs.main-infrastructure.outputs.functionapp_name }}
          FUNCTION_APP_IDENTITY_NAME: ${{ needs.main-infrastructure.outputs.function_app_identity_name }}
        run: |
          set -euo pipefail

          function_app_id=$(az functionapp show \
            --resource-group "$RESOURCE_GROUP_NAME" \
            --name "$FUNCTION_APP_NAME" \
            --query id --output tsv)
          
          identity_id=$(az identity show \
            --resource-group "$RESOURCE_GROUP_NAME" \
            --name "$FUNCTION_APP_IDENTITY_NAME" \
            --query id --output tsv)

          if [[ -z "$function_app_id" || -z "$identity_id" ]]; then
            echo "Error: Function App or managed identity resource ID is empty."
            exit 1
          fi

          az resource update \
            --ids "$function_app_id" \
            --api-version 2023-12-01 \
            --set properties.keyVaultReferenceIdentity="$identity_id" \
            --output none

          actual_identity_id=$(az resource show \
            --ids "$function_app_id" \
            --api-version 2023-12-01 \
            --query properties.keyVaultReferenceIdentity --output tsv)
          if [[ "${actual_identity_id,,}" != "${identity_id,,}" ]]; then
            echo "Error: Key Vault reference identity was not applied."
            exit 1
          fi

          az rest --method post \
            --url "https://management.azure.com${function_app_id}/config/configreferences/appsettings/refresh?api-version=2022-03-01" \
            --output none
