name: main-infrastructure

on:
  workflow_call:
    inputs:
      environment:
        required: true
        type: string

    outputs:
      resource_group_name:
        description: "The name of the resource group"
        value: ${{ jobs.main-infrastructure.outputs.resource_group_name }}
      functionapp_name:
        description: "The name of the function app"
        value: ${{ jobs.main-infrastructure.outputs.functionapp_name }}
      function_app_identity_name:
        description: "The function app identity name for the Key Vault reference"
        value: ${{ jobs.main-infrastructure.outputs.function_app_identity_name }}
      review_static_web_app_name:
        description: "The review SPA Static Web App name"
        value: ${{ jobs.main-infrastructure.outputs.review_static_web_app_name }}
      review_static_web_app_url:
        description: "The Telegram Mini App HTTPS URL"
        value: ${{ jobs.main-infrastructure.outputs.review_static_web_app_url }}
      review_api_url:
        description: "The public API origin used by the Mini App"
        value: ${{ jobs.main-infrastructure.outputs.review_api_url }}

permissions:
  id-token: write
  contents: read

env:
  ARM_TENANT_ID: ${{ secrets.ARM_TENANT_ID }}
  ARM_SUBSCRIPTION_ID: ${{ secrets.ARM_SUBSCRIPTION_ID }}
  ARM_CLIENT_ID: ${{ secrets.ARM_CLIENT_ID }}
  ARM_USE_OIDC: "true"

jobs:
  setup-vm-runner-connectivity:
    uses: ./.github/workflows/runner-connectivity.yaml
    with:
      environment: ${{ inputs.environment }}
      enable_runner_endpoints: true
    secrets: inherit

  plan-infrastructure:
    name: Plan infrastructure
    needs: setup-vm-runner-connectivity
    if: ${{ !cancelled() && needs.setup-vm-runner-connectivity.result == 'success' }}
    runs-on: self-hosted
    environment: ${{ inputs.environment }}
    defaults:
      run:
        shell: bash
        working-directory: src/infrastructure
    env:
      TF_VAR_review_frontend_origins: ${{ vars.REVIEW_FRONTEND_ORIGINS || '["http://localhost:5173"]' }}
    outputs:
      plan_artifact_id: ${{ steps.upload-plan.outputs.artifact-id }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false

      - name: Azure login
        uses: azure/login@v3.1.0
        with:
          client-id: ${{ secrets.ARM_CLIENT_ID }}
          tenant-id: ${{ secrets.ARM_TENANT_ID }}
          subscription-id: ${{ secrets.ARM_SUBSCRIPTION_ID }}

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v4.0.1
        with:
          terraform_version: "1.17.0"
          terraform_wrapper: false

      - name: Terraform Init
        env:
          # backend configuration
          AZ_TERRAFORM_BACKEND_STORAGEACCOUNT: ${{ vars.AZ_TERRAFORM_BACKEND_STORAGEACCOUNT }}
          AZ_TERRAFORM_BACKEND_RESOURCEGROUP: ${{ vars.AZ_TERRAFORM_BACKEND_RESOURCEGROUP }}
          AZ_BACKEND_CONTAINER_NAME: ${{ inputs.environment }}
          AZ_MAIN_STATE_FILE_KEY: "terraform.tfstate"
        run: |
          terraform init -input=false -lockfile=readonly \
            -backend-config="storage_account_name=${AZ_TERRAFORM_BACKEND_STORAGEACCOUNT}"  \
            -backend-config="container_name=${AZ_BACKEND_CONTAINER_NAME}" \
            -backend-config="key=${AZ_MAIN_STATE_FILE_KEY}" \
            -backend-config="resource_group_name=${AZ_TERRAFORM_BACKEND_RESOURCEGROUP}"

      - name: Terraform Plan
        id: tfplan
        env:
          DEPLOY_ENVIRONMENT: ${{ inputs.environment }}
          TF_VAR_keyvault_administrator_object_id: ${{ secrets.AZ_OWNER_OBJECT_ID }}
          TF_VAR_telegram_bot_token: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TF_VAR_telegram_bot_secret_header: ${{ secrets.TELEGRAM_BOT_SECRET_HEADER }}
        run: |
          set -euo pipefail
          umask 077
          plan_dir="$RUNNER_TEMP/tfplan-plan.${GITHUB_RUN_ID}.${GITHUB_RUN_ATTEMPT}"
          mkdir -- "$plan_dir"
          echo "directory=$plan_dir" >> "$GITHUB_OUTPUT"
          terraform plan -input=false -no-color -out="$plan_dir/tfplan" -var-file="environments/$DEPLOY_ENVIRONMENT.tfvars"

      - name: Upload Terraform plan
        id: upload-plan
        uses: actions/upload-artifact@v7.0.2
        with:
          name: terraform-plan-${{ inputs.environment }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ steps.tfplan.outputs.directory }}/tfplan
          retention-days: 2
          if-no-files-found: error

      - name: Remove local plan files
        if: always() && steps.tfplan.outputs.directory != ''
        env:
          PLAN_DIR: ${{ steps.tfplan.outputs.directory }}
        run: rm -rf -- "$PLAN_DIR"

  main-infrastructure:
    name: Apply saved Terraform plan
    needs: plan-infrastructure
    if: >-
      ${{ !cancelled() && needs.plan-infrastructure.result == 'success' &&
        needs.plan-infrastructure.outputs.plan_artifact_id != '' }}
    runs-on: self-hosted
    environment: ${{ inputs.environment }}
    defaults:
      run:
        shell: bash
        working-directory: src/infrastructure

    outputs:
      resource_group_name: ${{ steps.generate-outputs.outputs.resource_group_name }}
      functionapp_name: ${{ steps.generate-outputs.outputs.functionapp_name }}
      function_app_identity_name: ${{ steps.generate-outputs.outputs.function_app_identity_name }}
      review_static_web_app_name: ${{ steps.generate-outputs.outputs.review_static_web_app_name }}
      review_static_web_app_url: ${{ steps.generate-outputs.outputs.review_static_web_app_url }}
      review_api_url: ${{ steps.generate-outputs.outputs.review_api_url }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false

      - name: Azure login
        uses: azure/login@v3.1.0
        with:
          client-id: ${{ secrets.ARM_CLIENT_ID }}
          tenant-id: ${{ secrets.ARM_TENANT_ID }}
          subscription-id: ${{ secrets.ARM_SUBSCRIPTION_ID }}

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v4.0.1
        with:
          terraform_version: "1.17.0"
          terraform_wrapper: false

      - name: Terraform Init
        env:
          # backend configuration
          AZ_TERRAFORM_BACKEND_STORAGEACCOUNT: ${{ vars.AZ_TERRAFORM_BACKEND_STORAGEACCOUNT }}
          AZ_TERRAFORM_BACKEND_RESOURCEGROUP: ${{ vars.AZ_TERRAFORM_BACKEND_RESOURCEGROUP }}
          AZ_BACKEND_CONTAINER_NAME: ${{ inputs.environment }}
          AZ_MAIN_STATE_FILE_KEY: "terraform.tfstate"
        run: |
          terraform init -input=false -lockfile=readonly \
            -backend-config="storage_account_name=${AZ_TERRAFORM_BACKEND_STORAGEACCOUNT}"  \
            -backend-config="container_name=${AZ_BACKEND_CONTAINER_NAME}" \
            -backend-config="key=${AZ_MAIN_STATE_FILE_KEY}" \
            -backend-config="resource_group_name=${AZ_TERRAFORM_BACKEND_RESOURCEGROUP}"

      - name: Create isolated plan directory
        id: plan-directory
        run: |
          set -euo pipefail
          umask 077
          plan_dir="$RUNNER_TEMP/tfplan-apply.${GITHUB_RUN_ID}.${GITHUB_RUN_ATTEMPT}"
          mkdir -- "$plan_dir"
          echo "directory=$plan_dir" >> "$GITHUB_OUTPUT"

      - name: Download plan from this run
        uses: actions/download-artifact@v8.0.2
        with:
          artifact-ids: ${{ needs.plan-infrastructure.outputs.plan_artifact_id }}
          path: ${{ steps.plan-directory.outputs.directory }}
          merge-multiple: true
          digest-mismatch: error

      - name: Apply saved Terraform plan
        env:
          PLAN_DIR: ${{ steps.plan-directory.outputs.directory }}
        run: |
          set -euo pipefail
          umask 077
          trap 'rm -f "$PLAN_DIR/tfplan"' EXIT
          terraform apply -input=false -no-color "$PLAN_DIR/tfplan"

      - name: Remove local plan files
        if: always() && steps.plan-directory.outputs.directory != ''
        env:
          PLAN_DIR: ${{ steps.plan-directory.outputs.directory }}
        run: rm -rf -- "$PLAN_DIR"

      - name: Generate outputs
        id: generate-outputs
        run: |
          RESOURCE_GROUP_NAME=$(terraform output -raw resource_group_name)
          FUNCTION_APP_NAME=$(terraform output -raw functionapp_name)
          FUNCTION_APP_IDENTITY_NAME=$(terraform output -raw function_app_identity_name)
          REVIEW_STATIC_WEB_APP_NAME=$(terraform output -raw review_static_web_app_name)
          REVIEW_STATIC_WEB_APP_URL=$(terraform output -raw review_static_web_app_url)
          REVIEW_API_URL=$(terraform output -raw review_api_url)
          if [ -z "$RESOURCE_GROUP_NAME" ] || [ -z "$FUNCTION_APP_NAME" ] || [ -z "$FUNCTION_APP_IDENTITY_NAME" ]; then
            echo "Error: RESOURCE_GROUP_NAME or FUNCTION_APP_NAME or FUNCTION_APP_IDENTITY_NAME is empty."
            exit 1
          fi
          echo "resource_group_name=$RESOURCE_GROUP_NAME" >> $GITHUB_OUTPUT
          echo "functionapp_name=$FUNCTION_APP_NAME" >> $GITHUB_OUTPUT
          echo "function_app_identity_name=$FUNCTION_APP_IDENTITY_NAME" >> $GITHUB_OUTPUT
          if [ -z "$REVIEW_STATIC_WEB_APP_NAME" ] || [ -z "$REVIEW_STATIC_WEB_APP_URL" ] || [ -z "$REVIEW_API_URL" ]; then
            echo "Error: Review Static Web App outputs are empty."
            exit 1
          fi
          echo "review_static_web_app_name=$REVIEW_STATIC_WEB_APP_NAME" >> $GITHUB_OUTPUT
          echo "review_static_web_app_url=$REVIEW_STATIC_WEB_APP_URL" >> $GITHUB_OUTPUT
          echo "review_api_url=$REVIEW_API_URL" >> $GITHUB_OUTPUT

  configure-key-vault-references:
    needs: main-infrastructure
    runs-on: self-hosted
    environment: ${{ inputs.environment }}

    steps:
      - name: Azure login
        uses: azure/login@v3.1.0
        with:
          client-id: ${{ secrets.ARM_CLIENT_ID }}
          tenant-id: ${{ secrets.ARM_TENANT_ID }}
          subscription-id: ${{ secrets.ARM_SUBSCRIPTION_ID }}

      - name: Configure Key Vault reference identity
        shell: bash
        env:
          RESOURCE_GROUP_NAME: ${{ needs.main-infrastructure.outputs.resource_group_name }}
          FUNCTION_APP_NAME: ${{ needs.main-infrastructure.outputs.functionapp_name }}
          FUNCTION_APP_IDENTITY_NAME: ${{ needs.main-infrastructure.outputs.function_app_identity_name }}
        run: |
          set -euo pipefail

          function_app_id=$(az functionapp show \
            --resource-group "$RESOURCE_GROUP_NAME" \
            --name "$FUNCTION_APP_NAME" \
            --query id --output tsv)
          
          identity_id=$(az identity show \
            --resource-group "$RESOURCE_GROUP_NAME" \
            --name "$FUNCTION_APP_IDENTITY_NAME" \
            --query id --output tsv)

          if [[ -z "$function_app_id" || -z "$identity_id" ]]; then
            echo "Error: Function App or managed identity resource ID is empty."
            exit 1
          fi

          az resource update \
            --ids "$function_app_id" \
            --api-version 2023-12-01 \
            --set properties.keyVaultReferenceIdentity="$identity_id" \
            --output none

          actual_identity_id=$(az resource show \
            --ids "$function_app_id" \
            --api-version 2023-12-01 \
            --query properties.keyVaultReferenceIdentity --output tsv)
          if [[ "${actual_identity_id,,}" != "${identity_id,,}" ]]; then
            echo "Error: Key Vault reference identity was not applied."
            exit 1
          fi

          az rest --method post \
            --url "https://management.azure.com${function_app_id}/config/configreferences/appsettings/refresh?api-version=2022-03-01" \
            --output none
