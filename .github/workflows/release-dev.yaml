name: release dev

on:
  push:
    branches: main
  workflow_dispatch:

concurrency:
  group: infrastructure-dev
  cancel-in-progress: false

permissions:
  id-token: write
  contents: read

jobs:
  deploy-main-infrastructure-to-dev:
    uses: ./.github/workflows/main-infrastructure.yaml
    with:
      environment: dev
    secrets: inherit

  deploy-functionapp-to-dev:
    needs: deploy-main-infrastructure-to-dev
    uses: ./.github/workflows/functionapp.yaml
    with:
      environment: dev
      resource_group_name: ${{ needs.deploy-main-infrastructure-to-dev.outputs.resource_group_name }}
      function_app_name: ${{ needs.deploy-main-infrastructure-to-dev.outputs.functionapp_name }}
      function_app_identity_name: ${{ needs.deploy-main-infrastructure-to-dev.outputs.function_app_identity_name }}
    secrets: inherit

  deploy-review-spa-to-dev:
    needs: [deploy-main-infrastructure-to-dev, deploy-functionapp-to-dev]
    uses: ./.github/workflows/webapp.yaml
    with:
      environment: dev
      resource_group_name: ${{ needs.deploy-main-infrastructure-to-dev.outputs.resource_group_name }}
      web_app_name: ${{ needs.deploy-main-infrastructure-to-dev.outputs.review_web_app_name }}
    secrets: inherit

  cleanup-runner-endpoints:
    needs: [deploy-functionapp-to-dev, deploy-review-spa-to-dev]
    uses: ./.github/workflows/cleanup-runner-endpoints.yaml
    with:
      environment: dev
    secrets: inherit
