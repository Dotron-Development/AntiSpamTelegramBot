name: vm-runner-connectivity

on:
  workflow_call:
    inputs:
      environment:
        required: true
        type: string
      enable_runner_endpoints:
        required: true
        type: boolean

permissions:
  id-token: write
  contents: read

env:
  ARM_TENANT_ID: ${{ secrets.ARM_TENANT_ID }}
  ARM_SUBSCRIPTION_ID: ${{ secrets.ARM_SUBSCRIPTION_ID }}
  ARM_CLIENT_ID: ${{ secrets.ARM_CLIENT_ID }}
  ARM_USE_OIDC: "true"
  TF_VAR_keyvault_administrator_object_id: ${{ secrets.AZ_OWNER_OBJECT_ID }}
  TF_VAR_telegram_bot_token: ${{ secrets.TELEGRAM_BOT_TOKEN }}
  TF_VAR_telegram_bot_secret_header: ${{ secrets.TELEGRAM_BOT_SECRET_HEADER }}
  TF_VAR_enable_runner_endpoints: ${{ inputs.enable_runner_endpoints }}

jobs:
  vm-runner-connectivity:
    runs-on: self-hosted
    environment: ${{ inputs.environment }}
    env:
      TF_VAR_review_frontend_origins: ${{ vars.REVIEW_FRONTEND_ORIGINS || '["http://localhost:5173"]' }}
    defaults:
      run:
        shell: bash
        working-directory: src/infrastructure

    steps:
      - name: Checkout code
        uses: actions/checkout@v7.0.1

      - name: Verify Inputs
        env:
          DEPLOY_ENVIRONMENT: ${{ inputs.environment }}
        run: |
          case "$DEPLOY_ENVIRONMENT" in
            dev|prod|ppr) ;;
            *) echo "Invalid environment: $DEPLOY_ENVIRONMENT"; exit 1 ;;
          esac

      - name: Azure login
        uses: azure/login@v3.1.0
        with:
          client-id: ${{ secrets.ARM_CLIENT_ID }}
          tenant-id: ${{ secrets.ARM_TENANT_ID }}
          subscription-id: ${{ secrets.ARM_SUBSCRIPTION_ID }}

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v4.0.1
        with:
          terraform_version: "1.17.0"
          terraform_wrapper: false

      - name: Terraform Init
        env:
          AZ_TERRAFORM_BACKEND_STORAGEACCOUNT: ${{ vars.AZ_TERRAFORM_BACKEND_STORAGEACCOUNT }}
          AZ_TERRAFORM_BACKEND_RESOURCEGROUP: ${{ vars.AZ_TERRAFORM_BACKEND_RESOURCEGROUP }}
          AZ_BACKEND_CONTAINER_NAME: ${{ inputs.environment }}
        run: |
          terraform init \
            -backend-config="storage_account_name=${AZ_TERRAFORM_BACKEND_STORAGEACCOUNT}" \
            -backend-config="container_name=${AZ_BACKEND_CONTAINER_NAME}" \
            -backend-config="key=terraform.tfstate" \
            -backend-config="resource_group_name=${AZ_TERRAFORM_BACKEND_RESOURCEGROUP}"

      - name: Detect private runner connectivity
        id: connectivity
        env:
          DEPLOY_ENVIRONMENT: ${{ inputs.environment }}
          ENABLE_RUNNER_ENDPOINTS: ${{ inputs.enable_runner_endpoints }}
        run: |
          mode=cleanup
          if [[ "$ENABLE_RUNNER_ENDPOINTS" == true ]]; then mode=setup; fi
          bash runner-connectivity.sh "$mode" "$DEPLOY_ENVIRONMENT"

      - name: Plan runner connectivity setup
        if: ${{ steps.connectivity.outputs.required == 'true' && inputs.enable_runner_endpoints }}
        env:
          DEPLOY_ENVIRONMENT: ${{ inputs.environment }}
          KEY_VAULT_PRIVATE: ${{ steps.connectivity.outputs.key_vault }}
          STORAGE_PRIVATE: ${{ steps.connectivity.outputs.storage }}
          TF_VAR_functions_service_endpoints_override: ${{ steps.connectivity.outputs.functions_service_endpoints || 'null' }}
        # Restore the data-plane path before the full plan refreshes it.
        run: |
          set -euo pipefail
          targets=()
          if [[ "$KEY_VAULT_PRIVATE" == true ]]; then targets+=(-target=time_sleep.kv_dns_propagation); fi
          if [[ "$STORAGE_PRIVATE" == true ]]; then targets+=(-target=time_sleep.data_storage_dns_propagation); fi
          terraform plan -out=connectivity.tfplan -var-file="environments/$DEPLOY_ENVIRONMENT.tfvars" \
            -var=disable_public_access=true "${targets[@]}"

      - name: Plan runner connectivity cleanup
        if: ${{ steps.connectivity.outputs.required == 'true' && !inputs.enable_runner_endpoints }}
        env:
          DEPLOY_ENVIRONMENT: ${{ inputs.environment }}
        # Destroy mode prevents the cleanup plan from reapplying either access mode.
        run: |
          terraform plan -destroy -out=connectivity.tfplan -var-file="environments/$DEPLOY_ENVIRONMENT.tfvars" \
            -target=time_sleep.kv_dns_propagation \
            -target=time_sleep.data_storage_dns_propagation \
            -target=azurerm_private_endpoint.kv_runner_pe \
            -target=azurerm_private_endpoint.data_storage_runner_pe \
            -target=azurerm_private_dns_a_record.keyvault_runner \
            -target=azurerm_private_dns_a_record.data_storage_runner

      - name: Verify runner connectivity plan
        if: ${{ steps.connectivity.outputs.required == 'true' && (!inputs.enable_runner_endpoints || steps.connectivity.outputs.functions_service_endpoints != '') }}
        uses: actions/github-script@v8
        env:
          ENABLE_RUNNER_ENDPOINTS: ${{ inputs.enable_runner_endpoints }}
        with:
          script: |
            const { resolve } = require('node:path');
            const { exitCode, stdout } = await exec.getExecOutput(
              'terraform', ['show', '-json', 'connectivity.tfplan'],
              { cwd: resolve(process.env.GITHUB_WORKSPACE, 'src', 'infrastructure'), silent: true, ignoreReturnCode: true }
            );
            if (exitCode !== 0) throw new Error(`terraform show failed (exit ${exitCode})`);

            let plan;
            try {
              plan = JSON.parse(stdout);
            } catch {
              throw new Error('Could not parse the Terraform runner connectivity plan');
            }

            const isSetup = process.env.ENABLE_RUNNER_ENDPOINTS === 'true';
            const temporary = new Set([
              'time_sleep.kv_dns_propagation',
              'time_sleep.data_storage_dns_propagation',
              'azurerm_private_endpoint.kv_runner_pe',
              'azurerm_private_endpoint.data_storage_runner_pe',
              'azurerm_private_dns_a_record.keyvault_runner',
              'azurerm_private_dns_a_record.data_storage_runner',
            ]);
            for (const { address, change: { actions } } of plan.resource_changes ?? []) {
              const operation = actions?.join(',');
              if (operation === 'no-op' || operation === 'read') continue;
              if (temporary.has(address.replace(/\[0\]$/, '')) &&
                  (isSetup ? ['create', 'update', 'delete,create', 'create,delete'].includes(operation) : operation === 'delete')) continue;
              throw new Error(`Runner connectivity plan refused an unexpected infrastructure change: ${address}`);
            }

      - name: Apply runner connectivity plan
        if: steps.connectivity.outputs.required == 'true'
        run: terraform apply connectivity.tfplan
