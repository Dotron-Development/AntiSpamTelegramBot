name: vm-runner-connectivity

on:
  workflow_call:
    inputs:
      environment:
        required: true
        type: string
      enable_runner_endpoints:
        required: true
        type: boolean

permissions:
  id-token: write
  contents: read

env:
  ARM_TENANT_ID: ${{ secrets.ARM_TENANT_ID }}
  ARM_SUBSCRIPTION_ID: ${{ secrets.ARM_SUBSCRIPTION_ID }}
  ARM_CLIENT_ID: ${{ secrets.ARM_CLIENT_ID }}
  ARM_USE_OIDC: "true"
  TF_VAR_keyvault_administrator_object_id: ${{ secrets.AZ_OWNER_OBJECT_ID }}
  TF_VAR_telegram_bot_token: ${{ secrets.TELEGRAM_BOT_TOKEN }}
  TF_VAR_telegram_bot_secret_header: ${{ secrets.TELEGRAM_BOT_SECRET_HEADER }}
  TF_VAR_enable_runner_endpoints: ${{ inputs.enable_runner_endpoints }}

jobs:
  vm-runner-connectivity:
    runs-on: self-hosted
    environment: ${{ inputs.environment }}
    env:
      TF_VAR_review_frontend_origins: ${{ vars.REVIEW_FRONTEND_ORIGINS || '["http://localhost:5173"]' }}
    defaults:
      run:
        shell: bash
        working-directory: src/infrastructure

    steps:
      - name: Checkout code
        uses: actions/checkout@v7.0.1

      - name: Verify Inputs
        env:
          DEPLOY_ENVIRONMENT: ${{ inputs.environment }}
        run: |
          case "$DEPLOY_ENVIRONMENT" in
            dev|prod|ppr) ;;
            *) echo "Invalid environment: $DEPLOY_ENVIRONMENT"; exit 1 ;;
          esac

      - name: Azure login
        uses: azure/login@v3.1.0
        with:
          client-id: ${{ secrets.ARM_CLIENT_ID }}
          tenant-id: ${{ secrets.ARM_TENANT_ID }}
          subscription-id: ${{ secrets.ARM_SUBSCRIPTION_ID }}

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v4.0.1
        with:
          terraform_version: "1.17.0"
          terraform_wrapper: false

      - name: Terraform Init
        env:
          AZ_TERRAFORM_BACKEND_STORAGEACCOUNT: ${{ vars.AZ_TERRAFORM_BACKEND_STORAGEACCOUNT }}
          AZ_TERRAFORM_BACKEND_RESOURCEGROUP: ${{ vars.AZ_TERRAFORM_BACKEND_RESOURCEGROUP }}
          AZ_BACKEND_CONTAINER_NAME: ${{ inputs.environment }}
        run: |
          terraform init \
            -backend-config="storage_account_name=${AZ_TERRAFORM_BACKEND_STORAGEACCOUNT}" \
            -backend-config="container_name=${AZ_BACKEND_CONTAINER_NAME}" \
            -backend-config="key=terraform.tfstate" \
            -backend-config="resource_group_name=${AZ_TERRAFORM_BACKEND_RESOURCEGROUP}"

      - name: Detect private runner connectivity
        id: connectivity
        env:
          DEPLOY_ENVIRONMENT: ${{ inputs.environment }}
        run: |
          set -euo pipefail
          if ! grep -Eq '^[[:space:]]*disable_public_access[[:space:]]*=[[:space:]]*false[[:space:]]*(#.*)?$' \
            "environments/${DEPLOY_ENVIRONMENT}.tfvars"; then
            echo "required=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          # Preserve existing private connectivity for refresh until the full cutover plan is applied.
          if ! state_addresses=$(terraform state list 2>&1); then
            if [[ "$state_addresses" == "No state file was found!"* ]]; then
              echo "required=false" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            printf '%s\n' "$state_addresses" >&2
            exit 1
          fi

          if grep -Eq '^azurerm_private_dns_zone\.(private_dns|data_storage_private_dns)\[0\]$' <<< "$state_addresses"; then
            echo "required=true" >> "$GITHUB_OUTPUT"
          else
            echo "required=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Plan runner connectivity setup
        if: ${{ steps.connectivity.outputs.required == 'true' && inputs.enable_runner_endpoints }}
        # Refreshing existing secrets requires connectivity to be restored first.
        run: |
          terraform plan -refresh=false -out=connectivity.tfplan -var-file=environments/${{ inputs.environment }}.tfvars \
            -var=disable_public_access=true \
            -target=time_sleep.kv_dns_propagation \
            -target=time_sleep.data_storage_dns_propagation

      - name: Plan runner connectivity cleanup
        if: ${{ steps.connectivity.outputs.required == 'true' && !inputs.enable_runner_endpoints }}
        # Cleanup must not reconcile unrelated, unapproved infrastructure drift.
        run: |
          terraform plan -out=connectivity.tfplan -var-file=environments/${{ inputs.environment }}.tfvars \
            -var=disable_public_access=true \
            -target=time_sleep.kv_dns_propagation \
            -target=time_sleep.data_storage_dns_propagation \
            -target=azurerm_private_endpoint.kv_runner_pe \
            -target=azurerm_private_endpoint.data_storage_runner_pe \
            -target=azurerm_private_dns_a_record.keyvault_runner \
            -target=azurerm_private_dns_a_record.data_storage_runner

      - name: Verify runner connectivity cleanup plan
        if: ${{ steps.connectivity.outputs.required == 'true' && !inputs.enable_runner_endpoints }}
        uses: actions/github-script@v8
        with:
          script: |
            const { resolve } = require('node:path');
            const { exitCode, stdout } = await exec.getExecOutput(
              'terraform', ['show', '-json', 'connectivity.tfplan'],
              { cwd: resolve(process.env.GITHUB_WORKSPACE, 'src', 'infrastructure'), silent: true, ignoreReturnCode: true }
            );
            if (exitCode !== 0) throw new Error(`terraform show failed (exit ${exitCode})`);

            let plan;
            try {
              plan = JSON.parse(stdout);
            } catch {
              throw new Error('Could not parse the Terraform cleanup plan');
            }

            const allowed = new Map([
              ['time_sleep.kv_dns_propagation', 'delete'],
              ['time_sleep.data_storage_dns_propagation', 'delete'],
              ['azurerm_private_endpoint.kv_runner_pe', 'delete'],
              ['azurerm_private_endpoint.data_storage_runner_pe', 'delete'],
              ['azurerm_private_dns_a_record.keyvault_runner', 'delete'],
              ['azurerm_private_dns_a_record.data_storage_runner', 'delete'],
            ]);
            for (const { address, change: { actions } } of plan.resource_changes ?? []) {
              const expected = allowed.get(address.endsWith('[0]') ? address.slice(0, -3) : address);
              if (Array.isArray(actions) && actions.length === 1 &&
                  (actions[0] === 'no-op' || actions[0] === 'read' ||
                   (expected !== undefined && actions[0] === expected))) continue;
              throw new Error(`Cleanup refused an unexpected infrastructure change: ${address}`);
            }

      - name: Apply runner connectivity plan
        if: steps.connectivity.outputs.required == 'true'
        run: terraform apply connectivity.tfplan
